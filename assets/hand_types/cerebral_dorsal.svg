      <rect x="-90" y="48" width="191" height="28" rx="5" fill="#0b1120" stroke="#8b5cf6" stroke-width="1.2" filter="url(#badgeShadow)"/>
      <text x="93" y="60" text-anchor="end" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Frail & Slender</text>
      <text x="93" y="71" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Zero knots, zero fat puff</text>
    </g>
  <g class="layer-callouts callout-badge">
      <polyline points="376,248 404,248 404,240" fill="none" stroke="#8b5cf6" stroke-width="1.4" opacity="0.8"/>
