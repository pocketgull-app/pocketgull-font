  <!-- LAYER 7: LATERAL JOINT INSET PROFILE -->
  <g class="layer-inset" style="display: none;" transform="translate(420, 80)">
    <rect x="-10" y="-10" width="135" height="140" rx="8" fill="#090d16" stroke="#8b5cf6" stroke-width="1.4" filter="url(#badgeShadow)"/>
    <text x="57" y="10" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="10" font-weight="bold">LATERAL CUTAWAY</text>
    <text x="57" y="22" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="8.5">"Smooth Finger" Profile</text>
    <rect x="50" y="32" width="14" height="75" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.8"/>
    <ellipse cx="57" cy="30" rx="5" ry="4" fill="#8b5cf6" fill-opacity="0.5"/>
    <line x1="28" y1="68" x2="48" y2="68" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="25" y="71" text-anchor="end" fill="#8b5cf6" font-family="monospace" font-size="8">Straight</text>
    <text x="25" y="79" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="7.5">Edges</text>
  </g>

  <!-- LAYER 8: UNCLIPPED CALLOUT BADGES -->
  <g class="layer-callouts callout-badge">
      <polyline points="174,132 108,132 108,130" fill="none" stroke="#8b5cf6" stroke-width="1.4" opacity="0.8"/>
      <circle cx="174" cy="132" r="3" fill="#8b5cf6"/>
      <rect x="-90" y="118" width="198" height="28" rx="5" fill="#0b1120" stroke="#8b5cf6" stroke-width="1.2" filter="url(#badgeShadow)"/>
      <text x="100" y="130" text-anchor="end" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Smooth Fingers</text>
      <text x="100" y="141" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Straight parallel outlines</text>
    </g>
  <g class="layer-callouts callout-badge">
      <polyline points="241,68 101,68 101,60" fill="none" stroke="#8b5cf6" stroke-width="1.4" opacity="0.8"/>
