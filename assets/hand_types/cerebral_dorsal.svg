<svg viewBox="-100 0 680 520" class="hand-vector-svg" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowCer" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- LAYER 1: MASS SILHOUETTE -->
  <g class="layer-mass">
    <polygon points="120,70 360,70 235,445" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <text x="240" y="38" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="11" letter-spacing="1">GEOMETRIC ARCHETYPE: INVERTED TRIANGLE</text>
    <circle cx="235" cy="275" r="130" fill="url(#cerGlow)"/>
  </g>

  <!-- LAYER 2: UNDERLYING PRIMITIVES (Inverted Triangular Wedge & Uniform Cylinders) -->
  <g class="layer-primitives" style="display: none;" stroke="#8b5cf6" stroke-width="1.2" fill="#8b5cf6" fill-opacity="0.08" stroke-dasharray="3 3">
    <polygon points="174,255 296,255 275,445 195,445"/>
    <rect x="166" y="140" width="16" height="115" rx="3"/>
    <rect x="198" y="100" width="18" height="155" rx="3"/>
    <rect x="232" y="75" width="18" height="180" rx="3"/>
    <rect x="266" y="110" width="16" height="145" rx="3"/>
    <!-- Upward Slender Thumb Cylinder -->
    <rect x="330" y="280" width="14" height="85" rx="3" transform="rotate(-32, 340, 310)"/>
  </g>

  <!-- LAYER 3: RATIO & DIMENSION CALIPERS -->
  <g class="layer-ratios caliper-guide" style="display: none;">
      <line x1="150" y1="75" x2="90" y2="75" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
      <line x1="150" y1="255" x2="90" y2="255" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
      <line x1="100" y1="79" x2="100" y2="251" stroke="#8b5cf6" stroke-width="1.5"/>
      <polygon points="100,75 97,81 103,81" fill="#8b5cf6"/>
      <polygon points="100,255 97,249 103,249" fill="#8b5cf6"/>
      <rect x="55" y="151.0" width="90" height="26" rx="4" fill="#090d16" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="100" y="164.0" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="9.5" font-weight="bold">Digit III</text>
      <text x="100" y="175.0" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9">L = 180px</text>
    </g>
  <g class="layer-ratios caliper-guide" style="display: none;">
      <line x1="150" y1="255" x2="90" y2="255" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
      <line x1="150" y1="445" x2="90" y2="445" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
      <line x1="100" y1="259" x2="100" y2="441" stroke="#8b5cf6" stroke-width="1.5"/>
      <polygon points="100,255 97,261 103,261" fill="#8b5cf6"/>
      <polygon points="100,445 97,439 103,439" fill="#8b5cf6"/>
      <rect x="55" y="336.0" width="90" height="26" rx="4" fill="#090d16" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="100" y="349.0" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="9.5" font-weight="bold">Palm Height</text>
      <text x="100" y="360.0" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9">H = 190px</text>
    </g>
  <g class="layer-ratios caliper-guide" style="display: none;">
    <line x1="195" y1="445" x2="275" y2="445" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="200" y="455" width="80" height="20" rx="3" fill="#090d16" stroke="#8b5cf6" stroke-width="1"/>
    <text x="235" y="469" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="9">Wrist: 80px (0.60:1)</text>
    <rect x="420" y="190" width="135" height="32" rx="4" fill="#090d16" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="487" y="204" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="9.5" font-weight="bold">PALM : FINGER RATIO</text>
    <text x="487" y="216" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9">1.00 : 1.25 (Longest Reach)</text>
  </g>

  <!-- LAYER 4: SLOAN 5x5 OPTOTYPE GRID -->
  <g class="layer-sloan" style="display: none;">
<line x1="77.5" y1="97.5" x2="77.5" y2="422.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="77.5" y1="97.5" x2="402.5" y2="97.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="142.5" y1="97.5" x2="142.5" y2="422.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="77.5" y1="162.5" x2="402.5" y2="162.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="207.5" y1="97.5" x2="207.5" y2="422.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="77.5" y1="227.5" x2="402.5" y2="227.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="272.5" y1="97.5" x2="272.5" y2="422.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="77.5" y1="292.5" x2="402.5" y2="292.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="337.5" y1="97.5" x2="337.5" y2="422.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="77.5" y1="357.5" x2="402.5" y2="357.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="402.5" y1="97.5" x2="402.5" y2="422.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<line x1="77.5" y1="422.5" x2="402.5" y2="422.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
<rect x="77.5" y="75.5" width="165" height="18" rx="4" fill="#090d16" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
<text x="83.5" y="88.5" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">SLOAN 5×5 OPTOTYPE GRID (1U=65px)</text>
</g>

  <!-- LAYER 5: MAIN HAND CONTOUR (Anatomical Left Hand Dorsal with Upward Slender Thumb) -->
