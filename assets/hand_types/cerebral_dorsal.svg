          <path d="M 202.0 98.0 Q 207 102.0 212.0 98.0"
                fill="none" stroke="#8b5cf6" stroke-width="1.3" opacity="0.8"/>
          <path d="M 203.0 100.0 Q 207 96.5 211.0 100.0"
                fill="#8b5cf6" fill-opacity="0.4"/>
        </g>
    <g  class="nail-plate">
          <ellipse cx="241" cy="68" rx="6.0" ry="10.0"
                   fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1.8"/>
          <path d="M 236.0 74.66666666666667 Q 241 79.0 246.0 74.66666666666667"
                fill="none" stroke="#8b5cf6" stroke-width="1.3" opacity="0.8"/>
          <path d="M 237.0 77.0 Q 241 73.0 245.0 77.0"
                fill="#8b5cf6" fill-opacity="0.4"/>
        </g>
    <g  class="nail-plate">
          <ellipse cx="274" cy="102" rx="5.5" ry="8.5"
                   fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1.8"/>
          <path d="M 269.5 107.66666666666667 Q 274 111.5 278.5 107.66666666666667"
                fill="none" stroke="#8b5cf6" stroke-width="1.3" opacity="0.8"/>
          <path d="M 270.3333333333333 109.5 Q 274 106.25 277.6666666666667 109.5"
                fill="#8b5cf6" fill-opacity="0.4"/>
        </g>

    <!-- Parallel Straight Line Guides -->
    <line x1="164" y1="140" x2="164" y2="255" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75"/>
    <line x1="184" y1="140" x2="184" y2="255" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75"/>
