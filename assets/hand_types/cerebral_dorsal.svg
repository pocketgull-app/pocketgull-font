      <rect x="404" y="228" width="156" height="28" rx="5" fill="#0b1120" stroke="#8b5cf6" stroke-width="1.2" filter="url(#badgeShadow)"/>
      <text x="412" y="240" text-anchor="start" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Slender Upward Thumb</text>
      <text x="412" y="251" text-anchor="start" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Delicate 32° reach</text>
    </g>
  <g class="layer-callouts callout-badge">
      <polyline points="275,435 404,435 404,430" fill="none" stroke="#8b5cf6" stroke-width="1.4" opacity="0.8"/>
      <circle cx="275" cy="435" r="3" fill="#8b5cf6"/>
      <rect x="404" y="418" width="156" height="28" rx="5" fill="#0b1120" stroke="#8b5cf6" stroke-width="1.2" filter="url(#badgeShadow)"/>
      <text x="412" y="430" text-anchor="start" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Narrow Base</text>
      <text x="412" y="441" text-anchor="start" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Delicate frail wrist</text>
