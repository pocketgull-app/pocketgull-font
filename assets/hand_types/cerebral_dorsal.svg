          <path d="M 371.0 254.0 Q 376 258.0 381.0 254.0"
                fill="none" stroke="#8b5cf6" stroke-width="1.3" opacity="0.8"/>
          <path d="M 372.0 256.0 Q 376 252.5 380.0 256.0"
                fill="#8b5cf6" fill-opacity="0.4"/>
        </g>

