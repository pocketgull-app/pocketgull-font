  <!-- LAYER 1: MASS SILHOUETTE -->
  <g class="layer-mass">
    <path d="M 235 50 L 375 255 L 235 450 L 95 255 Z" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <text x="235" y="38" text-anchor="middle" fill="#ec4899" font-family="monospace" font-size="11" letter-spacing="1">GEOMETRIC ARCHETYPE: WEDGE / CONICAL TAPER</text>
    <circle cx="235" cy="265" r="130" fill="url(#thorGlow)"/>
  </g>

  <!-- LAYER 2: UNDERLYING PRIMITIVES (Converging Conical Wedges) -->
  <g class="layer-primitives" style="display: none;" stroke="#ec4899" stroke-width="1.2" fill="#ec4899" fill-opacity="0.08" stroke-dasharray="3 3">
    <polygon points="175,255 295,255 285,440 185,440"/>
    <polygon points="156,245 180,245 170,145"/>
    <polygon points="196,240 242,240 226,105"/>
    <polygon points="256,238 310,238 284,55"/>
    <polygon points="318,245 362,245 344,115"/>
    <!-- Upward Thumb Wedge -->
    <polygon points="350,350 422,235 385,385"/>
  </g>

