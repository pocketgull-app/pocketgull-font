      <line x1="160" y1="240" x2="100" y2="240" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
      <line x1="110" y1="59" x2="110" y2="236" stroke="#ec4899" stroke-width="1.5"/>
      <polygon points="110,55 107,61 113,61" fill="#ec4899"/>
      <polygon points="110,240 107,234 113,234" fill="#ec4899"/>
      <rect x="65" y="133.5" width="90" height="26" rx="4" fill="#090d16" stroke="#ec4899" stroke-width="1.2"/>
      <text x="110" y="146.5" text-anchor="middle" fill="#ec4899" font-family="system-ui" font-size="9.5" font-weight="bold">Digit III</text>
      <text x="110" y="157.5" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9">L = 185px</text>
    </g>
  <g class="layer-ratios caliper-guide" style="display: none;">
      <line x1="160" y1="240" x2="100" y2="240" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
      <line x1="160" y1="445" x2="100" y2="445" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
