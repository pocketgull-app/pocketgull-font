    <text x="26" y="68" text-anchor="end" fill="#ec4899" font-family="monospace" font-size="8">Smooth</text>
    <text x="26" y="76" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="7.5">Taper</text>
  </g>

