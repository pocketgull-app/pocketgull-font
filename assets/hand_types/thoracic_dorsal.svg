  <!-- LAYER 7: LATERAL JOINT INSET PROFILE -->
  <g class="layer-inset" style="display: none;" transform="translate(420, 80)">
    <rect x="-10" y="-10" width="135" height="140" rx="8" fill="#090d16" stroke="#ec4899" stroke-width="1.4" filter="url(#badgeShadow)"/>
    <text x="57" y="10" text-anchor="middle" fill="#ec4899" font-family="system-ui" font-size="10" font-weight="bold">LATERAL CUTAWAY</text>
    <text x="57" y="22" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="8.5">Conical Taper Profile</text>
    <path d="M 44 32 L 54 105 L 66 105 L 76 32 Z" fill="#ec4899" fill-opacity="0.25" stroke="#ec4899" stroke-width="1.8"/>
    <path d="M 52 32 Q 60 22 68 32 Z" fill="#ec4899" fill-opacity="0.5" stroke="#ec4899" stroke-width="1.2"/>
