    <circle cx="221" cy="190" r="16"/>
    <circle cx="220" cy="145" r="14"/>
    <!-- Middle Stacked Spheres (Digit III - Longest) -->
    <circle cx="283" cy="235" r="19"/>
    <circle cx="284" cy="175" r="17"/>
    <circle cx="285" cy="120" r="15"/>
    <!-- Index Stacked Spheres (Digit II) -->
