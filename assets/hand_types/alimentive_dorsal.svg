      <rect x="55" y="156.0" width="90" height="26" rx="4" fill="#090d16" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="100" y="169.0" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="9.5" font-weight="bold">Finger Len</text>
