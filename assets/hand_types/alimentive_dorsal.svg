    <circle cx="240" cy="265" r="180" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <text x="240" y="38" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11" letter-spacing="1">GEOMETRIC ARCHETYPE: CIRCLE</text>
    <circle cx="235" cy="285" r="130" fill="url(#alimGlow)"/>
  </g>

  <!-- LAYER 2: UNDERLYING PRIMITIVES (Stacked Spheres Along Natural Ray) -->
  <g class="layer-primitives" style="display: none;" stroke="#f59e0b" stroke-width="1.2" fill="#f59e0b" fill-opacity="0.08" stroke-dasharray="3 3">
