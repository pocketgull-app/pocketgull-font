<svg viewBox="-100 0 680 520" class="hand-vector-svg" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ossGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowOss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- LAYER 1: MASS SILHOUETTE -->
  <g class="layer-mass">
    <rect x="130" y="65" width="245" height="340" rx="4" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <text x="245" y="38" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11" letter-spacing="1">GEOMETRIC ARCHETYPE: OBLONG / RECTANGLE</text>
    <circle cx="245" cy="275" r="140" fill="url(#ossGlow)"/>
  </g>

  <!-- LAYER 2: UNDERLYING PRIMITIVES (Oblong Cylinders & Knotted Hinges) -->
  <g class="layer-primitives" style="display: none;" stroke="#10b981" stroke-width="1.2" fill="#10b981" fill-opacity="0.08" stroke-dasharray="3 3">
