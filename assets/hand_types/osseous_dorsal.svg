      <text x="90" y="149.0" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="9.5" font-weight="bold">Digit III</text>
      <text x="90" y="160.0" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9">L = 170px</text>
