License: Apache-2.0
LicenseUrl: https://raw.githubusercontent.com/pocketgull-app/pocketgull-font/main/LICENSE.txt
ShortDescription: Humanist sans-serif, display, slab, and telemetry monospace font superfamily.
Description: |
  PocketGull is an open-source clinical sans-serif, display, slab, and telemetry monospace
  font superfamily designed by Phil Gear. Originating from felt marker lettering created
  on cardstock, PocketGull combines humanist warmth with Louise Sloan 5:1 optotypic legibility
  and Institute for Safe Medication Practices (ISMP) character disambiguation.
