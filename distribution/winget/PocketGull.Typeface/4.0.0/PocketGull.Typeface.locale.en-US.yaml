ShortDescription: Optotypically calibrated clinical sans-serif, serif, slab, math, and 600 UPM telemetry font superfamily.
Description: |-
  PocketGull (v4.0.0) is an open-source clinical sans-serif, serif, slab, mathematical, and telemetry
  monospace font superfamily designed by Phil Gear. Originating from felt-marker lettering created on
  cardstock, PocketGull combines humanist warmth with Louise Sloan 5:1 optotypic legibility, ISO 15008
  telemetry ergonomics, 256 tactile Braille domes, and out-of-the-box ISMP character disambiguation
  (curved clinical l, bilateral serifed I, slashed zero, slashed Z).
