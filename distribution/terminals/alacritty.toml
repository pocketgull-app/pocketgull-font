# Alacritty Configuration for PocketGull Mono
# Fixed 600 UPM Monospace & Vintage CRT Amber P3 Phosphor

[font]
size = 13.0

[font.normal]
family = "PocketGull Mono"
style = "Regular"

[font.bold]
family = "PocketGull Mono"
style = "Bold"

[colors.primary]
background = "#0a0d12"
foreground = "#fbbf24"

[colors.cursor]
text = "#0a0d12"
cursor = "#fbbf24"

[colors.normal]
black   = "#05080c"
red     = "#ef4444"
green   = "#22c55e"
yellow  = "#f59e0b"
blue    = "#3b82f6"
magenta = "#a855f7"
cyan    = "#06b6d4"
white   = "#f4f4f5"

[colors.bright]
black   = "#52525b"
red     = "#f87171"
green   = "#4ade80"
yellow  = "#fbbf24"
blue    = "#60a5fa"
magenta = "#c084fc"
cyan    = "#22d3ee"
white   = "#ffffff"
