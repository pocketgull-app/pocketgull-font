# Kitty Terminal Configuration for PocketGull Mono
# Louise Sloan 5:1 Optotypes & ISMP Disambiguation

font_family      PocketGull Mono
bold_font        PocketGull Mono Bold
italic_font      auto
bold_italic_font auto

font_size 13.0

# OpenType feature flags: slashed zero, curved l, serifed I, slashed Z
font_features PocketGullMono-Regular +zero +cv08 +cv05 +cv11 +ss02
font_features PocketGullMono-Bold    +zero +cv08 +cv05 +cv11 +ss02

# Amber CRT P3 Phosphor Color Palette
foreground #fbbf24
background #0a0d12
cursor #fbbf24
cursor_text_color #0a0d12

# ANSI 16 Colors
color0 #05080c
color1 #ef4444
color2 #22c55e
color3 #f59e0b
color4 #3b82f6
color5 #a855f7
color6 #06b6d4
color7 #f4f4f5

color8  #52525b
color9  #f87171
color10 #4ade80
color11 #fbbf24
color12 #60a5fa
color13 #c084fc
color14 #22d3ee
color15 #ffffff
