# PocketGull Typefoundry — Fontspector 1.9.0 QA Configuration
# ===========================================================
# Enforces OpenType & Universal quality checks across every PocketGull subfamily
# while honoring intentional PocketGull architectural & security invariants.

exclude_checks = [
    # PocketGull enforces a strict Zero-VM TrueType security posture (CVE-2026-113679/113680):
    # fpgm, cvt , and prep bytecode programs are stripped by design.
    "smart_dropout",
]

[file_size]
# PocketGull full cuts bundle pan-Unicode script coverage (Latin, Cyrillic, Greek,
# IPA, Braille, Inuktitut/UCAS, Thai, Khmer, Music, Math, Chem) in single offline-ready
# binaries (2.3–3.5 MB static/3-axis VF; 5.7–6.6 MB Inline/Outline; 17.4 MB 16-axis VF).
WARN_SIZE = 7340032
FAIL_SIZE = 20971520
exclude_files = [
    "PocketGull-VF.ttf",
    "PocketGull-Halftone.ttf",
]

[[overrides]]
code = "contour-count"
status = "INFO"
reason = "PocketGull uses custom Salutogenic, ASL handshape, Display (Inline/Outline/Halftone), and polytonic contour geometry; all real diacritic (Vietnamese DOT BELOW, inverted breve, alt_caron) and dotted-circle contour defects are cured and enforced by validate_fonts.py."

[[overrides]]
code = "bad-numberOfHMetrics"
status = "INFO"
reason = "PocketGull monospaced and specialty cuts include 289–477 zero-width non-spacing marks (GDEF Class 3) across pan-Unicode blocks, requiring individual hmtx entries per fonttools#3014 while maintaining strict 600-unit advance widths across all spacing glyphs."
