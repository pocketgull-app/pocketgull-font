name: Build and Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Stage Pages Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Playwright & Browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E & Lighthouse Accessibility Tests
        run: |
          node --test test/specimen_interactions_playwright.test.mjs
          node --test test/lighthouse_and_wcag_audit.test.mjs

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage Production Web Assets (_site)
        run: |
          mkdir -p _site
          cp -r *.html *.css *.svg *.txt *.json *.xml *.pb *.cff CNAME _headers _site/ 2>/dev/null || true
          for dir in fonts css js assets web documentation standards data; do
            if [ -d "$dir" ]; then cp -r "$dir" _site/; fi
          done

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Wait for github-pages Artifact Metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts?name=github-pages" --jq '[.artifacts[] | select(.expired == false)] | length')
            echo "Attempt ${attempt}/12: found ${count} active github-pages artifact(s)"
            if [ "${count}" -ge 1 ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::github-pages artifact metadata did not appear within 36s"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
