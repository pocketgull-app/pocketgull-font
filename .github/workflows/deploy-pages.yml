name: Build and Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Playwright & Browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E & Lighthouse Accessibility Tests
        run: |
          node --test test/specimen_interactions_playwright.test.mjs
          node --test test/lighthouse_and_wcag_audit.test.mjs

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Stage Production Web Assets (_site)
        run: |
          mkdir -p _site
          cp -r *.html *.css *.svg *.txt *.json *.xml *.pb *.cff CNAME _headers _site/ 2>/dev/null || true
          for dir in fonts css js assets public web documentation standards article data; do
            if [ -d "$dir" ]; then cp -r "$dir" _site/; fi
          done

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1


