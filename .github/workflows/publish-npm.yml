name: Publish @pocketgull/font to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-npm:
    name: Verify & Publish @pocketgull/font (OIDC Provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify Package Manifest & Tarball
        run: |
          node -e "const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8')); if (pkg.name !== '@pocketgull/font') throw new Error('Unexpected package name'); console.log('Version:', pkg.version);"
          npm pack --dry-run

      - name: Publish to npm with Provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
