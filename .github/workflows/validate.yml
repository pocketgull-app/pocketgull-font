name: Google Fonts Quality Assurance & SWE Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  validate:
    name: Standards, Audits & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Dart SDK (3.11)
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: stable

      - name: Set up Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '24'

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies (Cryptographically Hash-Pinned)
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: 1. Thomas Phinney Forensic Font Invariant Audit (Dart 3.11)
        run: dart run tool/pocketgull_foundry.dart audit

      - name: 2. Automated SWE Unit & Metric Regression Tests (Node)
        run: npm run test:unit

      - name: 3. Run PocketGull Pre-Flight Validator
        run: python sources/validate_fonts.py

      - name: 4. Run Fontbakery (Google Fonts Profile)
        continue-on-error: true
        run: |
          fontbakery check-googlefonts \
            --loglevel WARN \
            --ghmarkdown fontbakery-report.md \
            fonts/ttf/*.ttf

      - name: Upload Fontbakery Report Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: fontbakery-qa-report
          path: fontbakery-report.md
