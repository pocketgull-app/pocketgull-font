name: Google Fonts Quality Assurance & SWE Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  validate:
    name: Standards, Audits & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Dart SDK (3.11)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies (Cryptographically Hash-Pinned)
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install Fontspector v1.9.0 (SHA-256 Verified Rust QA Binary)
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/fonttools/fontspector/releases/download/fontspector-v1.9.0/fontspector-1.9.0-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/fontspector.tar.gz
          echo "0d4a7fbc577f7f99a084dec2a7acc13f64f923cbe44c0e3c5e3d76469786b8e2  /tmp/fontspector.tar.gz" | sha256sum -c -
          mkdir -p /tmp/fontspector-bin
          tar -xzf /tmp/fontspector.tar.gz -C /tmp/fontspector-bin
          FS_BIN=$(find /tmp/fontspector-bin -name fontspector -type f | head -n 1)
          chmod +x "$FS_BIN"
          sudo mv "$FS_BIN" /usr/local/bin/fontspector
          fontspector --version

      - name: Install Node Dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 1. Thomas Phinney Forensic Font Invariant Audit (Dart 3.11)
        run: dart run tool/pocketgull_foundry.dart audit

      - name: 2. Automated SWE Unit & Metric Regression Tests (Node)
        run: npm run test:unit

      - name: 3. Seven Pillars Compliance & Dieter Rams Invariants Audit (Dart 3.11)
        run: dart run tool/pocketgull_foundry.dart compliance

      - name: 4. Google OSV-Scanner Lockfile & Dependency Security Audit (Dart 3.11)
        run: dart run tool/pocketgull_foundry.dart osv

      - name: 5. Run PocketGull Pre-Flight Validator
        run: python sources/validate_fonts.py

      - name: 6. Run Fontspector v1.9.0 Per-Subfamily Blocking Gate
        run: |
          set -euo pipefail
          mkdir -p fontspector-reports

          fontspector --profile universal --configuration fontspector.toml --skip-network \
            --loglevel WARN --ghmarkdown fontspector-reports/01-sans.md \
            fonts/ttf/PocketGull-Regular.ttf \
            fonts/ttf/PocketGull-Bold.ttf \
            fonts/ttf/PocketGull-Italic.ttf \
            fonts/ttf/PocketGull-BoldItalic.ttf \
            fonts/ttf/PocketGull-Fineliner.ttf \
            fonts/ttf/PocketGull-Black.ttf \
            fonts/ttf/PocketGull-Chiseltip.ttf \
            fonts/ttf/PocketGull-CondensedBold.ttf \
            fonts/ttf/PocketGull-MarkerRaw.ttf \
            fonts/ttf/PocketGull-Micro.ttf

          fontspector --profile universal --configuration fontspector.toml --skip-network \
            --loglevel WARN --ghmarkdown fontspector-reports/02-mono.md \
            fonts/ttf/PocketGullMono-Regular.ttf \
            fonts/ttf/PocketGullMono-Bold.ttf \
            fonts/ttf/PocketGullMono-Italic.ttf

          fontspector --profile universal --configuration fontspector.toml --skip-network \
            --loglevel WARN --ghmarkdown fontspector-reports/03-serif.md \
            fonts/ttf/PocketGull-Serif-Regular.ttf \
            fonts/ttf/PocketGull-Serif-Bold.ttf

          fontspector --profile universal --configuration fontspector.toml --skip-network \
            --loglevel WARN --ghmarkdown fontspector-reports/04-slab.md \
            fonts/ttf/PocketGull-Slab-Regular.ttf \
            fonts/ttf/PocketGull-Slab-Bold.ttf

          fontspector --profile universal --configuration fontspector.toml --skip-network \
            --loglevel WARN --ghmarkdown fontspector-reports/05-soft.md \
            fonts/ttf/PocketGull-Soft-Regular.ttf \
            fonts/ttf/PocketGull-Soft-Bold.ttf

          fontspector --profile universal --configuration fontspector.toml --skip-network \
            --loglevel WARN --ghmarkdown fontspector-reports/06-vf.md \
            fonts/ttf/PocketGull-VF.ttf

          fontspector --profile universal --configuration fontspector.toml --skip-network \
            --loglevel WARN --ghmarkdown fontspector-reports/07-serif-vf.md \
            fonts/ttf/PocketGull-Serif-VF.ttf

          fontspector --profile universal --configuration fontspector.toml --skip-network \
            --loglevel WARN --ghmarkdown fontspector-reports/08-asl-sign.md \
            fonts/ttf/PocketGull-ASL.ttf

          fontspector --profile universal --configuration fontspector.toml --skip-network \
            --loglevel WARN --ghmarkdown fontspector-reports/09-sign-vf.md \
            fonts/ttf/PocketGull-Sign-VF.ttf

          idx=10
          for standalone in \
            PocketGull-Algo.ttf \
            PocketGull-Chem.ttf \
            PocketGull-Emoji.ttf \
            PocketGull-Genome.ttf \
            PocketGull-Halftone.ttf \
            PocketGull-Inline.ttf \
            PocketGull-Lab.ttf \
            PocketGull-Learn.ttf \
            PocketGull-Math.ttf \
            PocketGull-Music.ttf \
            PocketGull-Numerics.ttf \
            PocketGull-Outline.ttf \
            PocketGull-Press.ttf \
            PocketGull-Sign.ttf \
            PocketGull-Soft.ttf \
            "PocketGullSerif[wght].ttf"; do
            fontspector --profile universal --configuration fontspector.toml --skip-network \
              --loglevel WARN --ghmarkdown "fontspector-reports/${idx}-${standalone%.ttf}.md" \
              "fonts/ttf/${standalone}"
            idx=$((idx + 1))
          done

          # ISO 15008 In-Car / Clinical Telemetry Display Acuity Gate
          fontspector --profile iso15008 --skip-network \
            --loglevel WARN --ghmarkdown fontspector-reports/99-iso15008-telemetry.md \
            fonts/ttf/PocketGull-CondensedBold.ttf

          cat fontspector-reports/*.md > fontspector-report.md

      - name: Upload Fontspector Report Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fontspector-qa-report
          path: fontspector-report.md
